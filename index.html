    <h2 id="detail-title" class="detail-title" style="color: #39ff14; position: relative; z-index: 1;">Active Pathway: Remac-PET</h2>
    <div class="microscope-reveal" style="position:relative; z-index: 1;">
      <div class="detail-vignette" aria-hidden="true"></div>
      <p class="detail-lead">Engineering Macrophages for Multi-Scale Bioremediation of Micro- &amp; Nanoplastics</p>
      <div style="margin: 0.5rem 0; padding: 0.5rem; border-left: 2px solid #ff9f43; background: rgba(255, 159, 67, 0.1);">
        <strong>Stage:</strong> Independently developed proposal / manuscript in preparation · seeking PhD placement
      </div>
      <h3>Problem</h3>
      <p>Micro- &amp; nanoplastics (MNPs) are detectable in every major human organ — the prefrontal cortex reached a median <strong>4,917 µg/g in 2024, up 47% from 2016</strong> (Nihart &amp; Campen et al., <em>Nature Medicine</em> 2025). Nanoplastics cross the blood-brain barrier, drive ROS-mediated mitochondrial dysfunction, saturate microglia (frustrated phagocytosis), and leave a transgenerational epigenetic scar via BDNF promoter IV hypermethylation. No therapy reverses this bioaccumulation.</p>
      <h3>Mechanism</h3>
      <p>Vpx-packaged lentiviral transduction (overcoming SAMHD1 restriction in myeloid cells) of THP-1 monocytes with an <strong>[Igκ-Leader]–[FAST-PETase N233K…]–[LAMP1 tail]</strong> fusion under an EF1α promoter. The LAMP1 GYEQF sorting signal targets enzymatic activity to the lysosome — exactly where phagocytosed MNPs reside — hydrolysing PET to EG + TPA monomers.</p>
      <h3>Research Objectives</h3>
      <div class="objectives">
        <div class="objective"><span class="obj-tag" style="color:#00e5ff;border-color:#00e5ff;">Aim 1</span><p>Molecular engineering &amp; acid-tolerance validation of the Lyso-PETase fusion at lysosomal pH 4.5; yeast surface-display directed-evolution screen (~10⁵ variants).</p></div>
        <div class="objective"><span class="obj-tag" style="color:#39ff14;border-color:#39ff14;">Aim 2</span><p>Generate &amp; characterise the Remac-PET cell line; lysosomal co-localisation (target PCC &gt; 0.75); HPLC-MS quantification of EG &amp; TPA degradation products at 24 &amp; 72 h.</p></div>
        <div class="objective"><span class="obj-tag" style="color:#ff9f43;border-color:#ff9f43;">Aim 3</span><p>Transwell neuroprotection assay (Remac-PET / SH-SY5Y); BDNF-promoter bisulfite sequencing &amp; ChIP-qPCR (H3K27me3); LDH, JC-1, CellROX &amp; Caspase-Glo readouts.</p></div>
      </div>
      <h3>Impact</h3>
      <p>Clear intracellular plastic reservoirs, halt direct neurotoxicity, and test whether MNP clearance <strong>rescues BDNF epigenetic damage</strong> — a novel, testable mechanistic claim with no published precedent.</p>
      <h3>Key References</h3>
      <ul style="font-size: 0.8rem; color: #a0a8c0;">
        <li>Nihart, Campen et al. (2025). <em>Bioaccumulation of microplastics in human brain.</em> Nature Medicine.</li>
        <li>Lu et al. (2022). <em>Machine learning-aided engineering of hydrolases for PET depolymerization.</em> Nature.</li>
        <li>Yoshida et al. (2016). <em>A bacterium that degrades and assimilates PET</em> (Ideonella sakaiensis). Science.</li>
      </ul>
    </div>

          tooltip.classList.add('visible');
          wrap.style.cursor = 'pointer';
        } else {
          tooltip.classList.remove('visible');
          wrap.style.cursor = 'crosshair';
        }
      });
      wrap.addEventListener('mouseleave', () => {
        hoverIdx = -1;
        tooltip.classList.remove('visible');
      });

      // Click → info box
      wrap.addEventListener('click', e => {
        if (!drawn) return;
        const idx = hit(e.clientX);
        if (idx < 0) return;
        showInfo(idx);
      });

      resize();
      startTs = null;
      animId = requestAnimationFrame(frame);

      // Robust HD sizing: re-fit on any size change + once the open transition settles
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => {
          if (!canvas || !document.body.contains(canvas)) { ro.disconnect(); return; }
          resize();
          if (drawn) drawFrame(1);
        });
        ro.observe(canvas);
      }
      setTimeout(() => {
        if (canvas && document.body.contains(canvas)) { resize(); if (drawn) drawFrame(1); }
      }, 480);
    }

    function hit(clientX) {
      if (!canvas) return -1;
      const r = canvas.getBoundingClientRect();
      const x = clientX - r.left;
      for (let i = 0; i < MILESTONES.length; i++) {
        if (MILESTONES[i]._cx && Math.abs(MILESTONES[i]._cx - x) < 32) return i;
      }
      return -1;
    }

    function resize() {
      if (!canvas) return;
      // clientWidth/Height = layout size, unaffected by the panel's scale transition
      // (getBoundingClientRect returned the shrunken, mid-animation size → blurry + merged).
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = canvas.clientWidth || Math.round(canvas.getBoundingClientRect().width);
      const h = canvas.clientHeight || 185;
      if (!w) return;
      canvas.width  = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildPts(w, h);
    }

    function buildPts(W, H) {
      const PAD  = Math.max(28, W * 0.05);
      BASE       = H * 0.75;
      const MAXH = H * 0.55;
      const USE  = W - PAD * 2;
      const N    = MILESTONES.length;
      const SW   = USE / (N + 1);
      pts = [{ x: PAD, y: BASE }];
      MILESTONES.forEach((m, i) => {
        const cx = PAD + SW * (i + 1);
        const sh = (m.h / 4) * MAXH;
        pts.push({ x: cx - SW * 0.28, y: BASE });
        pts.push({ x: cx - SW * 0.10, y: BASE + Math.min(sh * 0.18, 9) });
        pts.push({ x: cx,             y: BASE - sh });
        pts.push({ x: cx + SW * 0.10, y: BASE + Math.min(sh * 0.12, 6) });
        pts.push({ x: cx + SW * 0.22, y: BASE });
        m._cx = cx; m._sh = sh; m._base = BASE;
      });
      pts.push({ x: W - PAD, y: BASE });
    }

    function lerp(a, b, t) { return a + (b - a) * t; }
    function ptAt(t) {
      const tot = pts.length - 1;
      const i   = Math.min(Math.floor(t * tot), tot - 1);
      const f   = t * tot - i;
      return { x: lerp(pts[i].x, pts[i+1].x, f), y: lerp(pts[i].y, pts[i+1].y, f) };
    }

    // Get colour for a segment (interpolate between milestone colours)
    function segColor(segIdx) {
      // Map segment index to milestone index
      // 5 pts per milestone + 1 start + 1 end
      const mi = Math.min(Math.floor((segIdx - 1) / 5), MILESTONES.length - 1);
      return mi >= 0 ? MILESTONES[mi].color : MILESTONES[0].color;
    }

    function drawFrame(t) {
      // Use the CSS/layout size (ctx is already scaled by the capped DPR in resize()).
      // Recomputing with the raw devicePixelRatio broke on DPR-3 phones → oversized+blurry.
      const cap = Math.min(window.devicePixelRatio || 1, 2);
      const W = canvas.clientWidth || (canvas.width / cap), H = canvas.clientHeight || (canvas.height / cap);
      ctx.clearRect(0, 0, W, H);

      // Grid
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 7]);
      ctx.beginPath(); ctx.moveTo(0, BASE); ctx.lineTo(W, BASE); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      const end  = ptAt(t);
      const tot  = pts.length - 1;
      const di   = Math.floor(t * tot);

      // Draw colourful trace — segment by segment
      for (let i = 0; i < di && i < tot; i++) {
        const col = segColor(i);
        ctx.save();
        ctx.strokeStyle = col;
        ctx.lineWidth   = 2.5;
        ctx.lineJoin    = 'round';
        ctx.lineCap     = 'round';
        ctx.shadowColor = col;
        ctx.shadowBlur  = 10;
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[i+1].x, pts[i+1].y);
        ctx.stroke();
        ctx.restore();
      }
      // Partial last segment
      if (di < tot) {
        const col = segColor(di);
        ctx.save();
        ctx.strokeStyle = col;
        ctx.lineWidth   = 2.5;
        ctx.lineJoin    = 'round';
        ctx.lineCap     = 'round';
        ctx.shadowColor = col;
        ctx.shadowBlur  = 10;
        ctx.beginPath();
        ctx.moveTo(pts[di].x, pts[di].y);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();
        ctx.restore();

        // Moving glow dot
        ctx.save();
        ctx.fillStyle  = col; ctx.shadowColor = col; ctx.shadowBlur = 20;
        ctx.beginPath(); ctx.arc(end.x, end.y, 5, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }

      // Milestone labels + dots
      const revX = end.x;
      MILESTONES.forEach((m, mi) => {
        if (!m._cx || m._cx > revX + 2) return;
        const isHov = mi === hoverIdx;
        const col   = m.color;
        const isTop = m.h === 4;
        const fsz   = isTop ? Math.min(11, Math.max(9, W * 0.014))
                            : Math.min(9.5, Math.max(7.5, W * 0.012));

        // Peak dot
        ctx.save();
        ctx.fillStyle   = col; ctx.shadowColor = col;
        ctx.shadowBlur  = isHov ? 22 : 14;
        ctx.globalAlpha = isHov ? 1 : 0.9;
        ctx.beginPath(); ctx.arc(m._cx, m._base - m._sh, isHov ? 6.5 : 5, 0, Math.PI*2); ctx.fill();
        ctx.restore();

        // Label
        ctx.save();
        ctx.textAlign   = 'center';
        ctx.font        = `${isHov ? 700 : 600} ${fsz}px "JetBrains Mono",monospace`;
        ctx.fillStyle   = col;
        ctx.shadowColor = col;
        ctx.shadowBlur  = isHov ? 18 : 11; /* uniform glow for every milestone */
        const topY = m._base - m._sh - (isHov ? 26 : 24);
        ctx.fillText(m.label, m._cx, topY);
        ctx.restore();

        // Sublabel
        ctx.save();
        ctx.textAlign   = 'center';
        ctx.font        = `500 ${Math.min(8, Math.max(6.5, W*0.009))}px "JetBrains Mono",monospace`;
        ctx.fillStyle   = col;
        ctx.globalAlpha = 0.65;
        ctx.fillText(m.sublabel, m._cx, m._base - m._sh - (isHov ? 14 : 12));
        ctx.restore();

        // Year below baseline
        ctx.save();
        ctx.textAlign   = 'center';
        ctx.font        = `500 ${Math.min(8, Math.max(6.5, W*0.009))}px "JetBrains Mono",monospace`;
        ctx.fillStyle   = col;
        ctx.globalAlpha = isHov ? 0.9 : 0.5;
        ctx.fillText(m.year, m._cx, m._base + 19);
        ctx.restore();

        // Tick
        ctx.save();
        ctx.strokeStyle = col; ctx.lineWidth = isHov ? 1.5 : 1; ctx.globalAlpha = 0.5;
        ctx.beginPath(); ctx.moveTo(m._cx, m._base+2); ctx.lineTo(m._cx, m._base+9); ctx.stroke();
        ctx.restore();
      });

      // Blinking cursor at end
      if (t >= 1) {
        const now = performance.now();
        if (now - cursorTs > 520) { cursorOn = !cursorOn; cursorTs = now; }
        if (cursorOn) {
          const lastCol = MILESTONES[MILESTONES.length-1].color;
          ctx.save();
          ctx.fillStyle = lastCol; ctx.shadowColor = lastCol; ctx.shadowBlur = 20;
          ctx.beginPath(); ctx.arc(pts[pts.length-1].x + 8, BASE, 4, 0, Math.PI*2); ctx.fill();
          ctx.restore();
        }
      }
    }

    function frame(ts) {
      if (!startTs) startTs = ts;
      const t = Math.min((ts - startTs) / DURATION, 1);
      drawFrame(t);
      if (t < 1) { animId = requestAnimationFrame(frame); return; }
      drawn = true;
      animId = requestAnimationFrame(cursorLoop);
    }
    let ecgCursorLast = 0;
    function cursorLoop(ts) {
      if (!canvas || !document.body.contains(canvas)) { animId = null; return; }
      animId = requestAnimationFrame(cursorLoop);
      if (ts && ts - ecgCursorLast < 80) return; // ~12fps — enough for a blinking cursor
      ecgCursorLast = ts || 0;
      drawFrame(1);
    }

    function showInfo(idx) {
      const m = MILESTONES[idx];
      const d = m.info;
      const box = document.getElementById('eduInfoBox');
      if (!box) return;
      box.innerHTML = '';
      box.style.borderColor = m.color;

      const h = el => (tag, cls, txt) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (txt !== undefined) e.textContent = txt;
        return e;
      };

      const title = document.createElement('div');
      title.className = 'edu-info-title';
      title.style.color = m.color;
      title.textContent = d.title;

      const meta = document.createElement('div');
      meta.className = 'edu-info-meta';
      meta.textContent = d.inst + '  ·  ' + d.grade;

      const body = document.createElement('div');
      body.className = 'edu-info-body';
      body.textContent = d.body;

      const hi = document.createElement('div');
      hi.className = 'edu-info-highlight';
      hi.style.borderColor = m.color;
      hi.style.color       = m.color;
      hi.textContent = '⭐ ' + d.highlight;

      const tags = document.createElement('div');
      tags.className = 'edu-info-tags';
      d.tags.forEach(t => {
        const s = document.createElement('span');
        s.className = 'edu-tag';
        s.style.borderColor = m.color + '66';
        s.style.color       = m.color;
        s.textContent = t;
        tags.appendChild(s);
      });

      box.append(title, meta, hi, body, tags);
      box.classList.add('visible');
    }

    // Trigger init when education detail panel opens
    const detailScreen = document.getElementById('detail-screen');
    if (detailScreen) {
      const observer = new MutationObserver(() => {
        if (!detailScreen.classList.contains('open')) return;
        const c = document.getElementById('eduEcgCanvas');
        if (!c || c === canvas) return;
        // New canvas just appeared — education panel just opened
        drawn = false; pts = []; startTs = null;
        if (animId) cancelAnimationFrame(animId);
        // Small delay so the panel finishes its CSS transition first
        setTimeout(init, 120);
      });
      observer.observe(detailScreen, { attributes: true, attributeFilter: ['class'] });
    }

    window.addEventListener('resize', () => {
      if (!canvas || !drawn) return;
      if (animId) cancelAnimationFrame(animId);
      resize();
      drawFrame(1);
      animId = requestAnimationFrame(cursorLoop);
    });
  })();
  </script>

</body>
</html>
